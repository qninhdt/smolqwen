# T4 serving overlay -- sm75, no native FP8, no bf16 tensor cores.
#
# Turing has neither FP8 nor bf16 tensor cores, so both quantization and the dtype
# differ from l4.yaml for hardware reasons rather than pending measurement. This
# overlay exists so `serve` and the workload benchmark can run at all on a free T4
# while wiring is validated; no throughput number measured here transfers to l4.
dtype: float16
quantization: null
speculative_num_tokens: null
# 16 GB total, and the served process is alone on the card here.
max_model_len: 8192
max_num_seqs: 16
max_num_batched_tokens: 4096
