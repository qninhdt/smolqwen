# L4 sizing profile -- 24 GB, sm89 (native FP8).
#
# Sizing ONLY. A semantic field here fails at load: ProfileConfig is a closed
# model with extra="forbid", which is the actual guarantee wanted.
#
# Every value below is a PLACEHOLDER until the phase that owns it measures it.
# Each field is owned by exactly one phase (see plan.md "Cross-phase contracts");
# a later phase must not overwrite an earlier phase's measured value.

# `max_seq_length` defaults to 32,768 in ProfileConfig. It is deliberately absent
# until an L4 measurement proves that the cap must be lowered. Old profiling
# artifacts do not seed SFT sequence length.

# --- SFT target envelope. `micro_batch` is retained for non-SFT paths; padding-
# free SFT uses the total-token budget below and may contain a variable number of
# trajectories. The 32K L4 boundary and headroom are not measured yet.
micro_batch: 2
grad_accum: 8
max_tokens_per_microbatch: 32768

# --- Phase 6, set by the pool sweep (step 12), against measured episodes/hour.
# generation_concurrency is the vLLM batch width INSIDE one rollout_func call.
# It is not num_generations. Naming them separately is deliberate.
generation_concurrency: 8
active_pool_multiplier: 2
# Lowered first on OOM during generation, before touching concurrency or the step
# cap. The trainer holds its own allocation alongside vLLM on this card, and
# weight sync is a full ~4 GB bf16 round trip every step.
vllm_kv_fraction: 0.25

# --- Phase 7, set by the widening sweep (step 8), one axis at a time.
num_generations: 4

# --- Phase 4, set by the timeline profile. env_episodes_per_worker sets the crash
# blast radius explicitly: a worker that dies takes every episode it held with it.
env_worker_count: 4
env_episodes_per_worker: 8
