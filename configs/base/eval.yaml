# Phase 5 semantics: what gets measured and under which decoding. Every field
# here that appears in the manifest's INVARIANT set must be identical across the
# Base, SFT and SFT+RL runs, or assert_comparable refuses to put them in one table.

adapters:
  - bfcl_multi_turn

adapter_options:
  bfcl_multi_turn:
    # Dev and test coincide in this lab's design: multi-turn base is both the
    # in-training dev curve and the final test benchmark (200 tasks). The other
    # three v3 multi-turn scoring categories are owned by this adapter but are
    # not part of this experiment.
    categories:
      - multi_turn_base
    data_dir: third_party/gorilla/berkeley-function-call-leaderboard/bfcl_eval/data
    benchmark_commit: 6ea57973c7a6097fd7c5915698c54c17c5b1b6c8
http_model: smolqwen
http_timeout_s: 60.0

max_steps_per_task: 20

decoding:
  # Greedy: the comparison is the deliverable, and sampling noise across three
  # checkpoints would need many more runs to see the same effect.
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  max_new_tokens: 2048
  seed: 1234

# Reasoning mode for eval rendering. `false` renders generation prompts with
# Qwen's closed empty think block and decodes completions as content. Recorded in
# the manifest's invariant set -- runs at different render modes are different
# experiments. Should match the mode the checkpoints were trained under.
enable_thinking: false

output_dir: artifacts/evaluation
