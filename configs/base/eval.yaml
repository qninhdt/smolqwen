# Phase 5 semantics: what gets measured and under which decoding. Every field
# here that appears in the manifest's INVARIANT set must be identical across the
# Base, SFT and SFT+RL runs, or assert_comparable refuses to put them in one table.

adapters:
  - bfcl_multi_turn
  - envscaler_heldout

adapter_options:
  bfcl_multi_turn:
    # All four v3 multi-turn scoring categories. Upstream EnvScaler's bfcl_env
    # implements only multi_turn_base; this adapter owns the other categories.
    categories:
      - multi_turn_base
      - multi_turn_miss_func
      - multi_turn_miss_param
      - multi_turn_long_context
    data_dir: third_party/gorilla/berkeley-function-call-leaderboard/bfcl_eval/data
    benchmark_commit: 6ea57973c7a6097fd7c5915698c54c17c5b1b6c8
  envscaler_heldout:
    # The release has only 140 _sft / 51 _rl environments. The adapter owns
    # selection and records the exact held-out IDs in its manifest contribution.
    env_count: 10
    scenarios_per_env: 8
    runtime:
      env_metadata_source: vendored
      step_timeout_s: 10.0
      verify_timeout_s: 60.0
http_model: smolqwen
http_timeout_s: 60.0

max_steps_per_task: 20

decoding:
  # Greedy: the comparison is the deliverable, and sampling noise across three
  # checkpoints would need many more runs to see the same effect.
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  max_new_tokens: 2048
  seed: 1234

output_dir: artifacts/evaluation
