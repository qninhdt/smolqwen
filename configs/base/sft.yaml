# SFT semantics and optimizations. The profile owns the maximum trajectory
# length, token envelope (unpadded on L4/A100, dense padded on T4), and
# accumulation count.
# Its fixed `micro_batch` setting is not used to size SFT rows: the sampler fills
# complete trajectories up to the token envelope, so row count varies per batch.

model_id: Qwen/Qwen3.5-2B
# Pinned so two profiles cannot silently train against two model revisions.
model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc

dataset_dir: artifacts/data/sft
output_dir: artifacts/models/qwen3.5-2b-sft
merged_dir: artifacts/models/qwen3.5-2b-sft-merged

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: all-linear
  # BF16 on the normal path; T4's FP16 runtime keeps adapters in FP32 because
  # GradScaler rejects FP16 gradients. The base model still runs under FP16.
  adapter_dtype: bfloat16

training:
  learning_rate: 1.0e-4
  # 1-2 epochs maximum. A 2B model on ~9k trajectories can memorize, and more
  # epochs is not the fix for a loss curve turning up.
  num_train_epochs: 2.0
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 1
  # Optimizer-step cadence; uploads happen only when tracking.hub_repo_id is set.
  save_steps: 50
  seed: 1234

optimization:
  bf16: true
  # Required by the target 32K envelope; final L4 headroom remains a GPU gate.
  gradient_checkpointing: true
  # Load-bearing. Vocab is 248,320 with tied embeddings, so a dense logits tensor
  # is the dominant activation and the first thing to OOM on 24 GB -- ahead of
  # weights. The fused-kernel L4 validation remains required before training.
  liger_fused_linear_cross_entropy: true
  # The Qwen3.5 head supports an index-valued logits_to_keep. With padding-free
  # batches this projects only supervised next-token positions before Liger FLCE;
  # non-reasoning shards supervise a small fraction of each full trajectory.
  selective_logit_loss: true
  attn_implementation: flash_attention_2
  # Disabled after the same-shape L4 comparison: compile-off was faster and
  # avoids a long Inductor startup that can outlive a reclaimable Colab VM.
  regional_torch_compile: false
  # GDN layers run flash-linear-attention Triton kernels that upstream marks
  # torch.compiler.disable; compiling through them raises inductor errors, so the
  # exclusion list is not optional.
  compile_exclude_patterns:
    - linear_attn
    - mixer
    - conv1d

# Train-only, matching upstream EnvScaler's SFT (LlamaFactory, no validation set,
# loss curve on the training loss alone). No eval_loss and no in-training
# benchmark: the capability curve is GRPO's bench_eval boundary.
