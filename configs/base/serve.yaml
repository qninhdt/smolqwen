# Phase 8 semantics: how the endpoint is served. Per-GPU serving settings that
# were chosen by measurement live in configs/serving/{l4,a100}.yaml.

model_path: artifacts/models/qwen3.5-2b-sft-grpo-merged
served_model_name: smolqwen

max_model_len: 32768

# vLLM binds to loopback and the key-checking proxy is the only exposed service.
# --api-key challenges only GUARDED_PREFIX = ("/v1", "/v2", "/inference",
# "/cohere"), leaving /tokenize, /detokenize, /metrics, /version, /load open. On a
# public tunnel that is a free CPU-exhaustion vector plus model disclosure.
host: 127.0.0.1
port: 8000
proxy_port: 8080

reasoning_parser: qwen3
tool_call_parser: hermes

# Set per profile after measurement. FP8 on L4 (sm89, native FP8); AWQ/GPTQ int4
# or BF16 on A100 (sm80, no FP8 path). Never ship a quantized config whose quality
# cost was not measured -- every quantized row carries a BFCL re-eval.
quantization: null

# MTP-1 only. Qwen3.5's GDN conv_states and recurrent_states carry no sequence
# dimension, so a partially accepted draft cannot be rolled back to the accepted
# prefix; a 1-token draft is all-or-nothing and needs no rollback. Left null until
# Phase 8 step 7 measures the acceptance rate.
speculative_num_tokens: null

enable_prefix_caching: true
max_num_seqs: 64
max_num_batched_tokens: 8192
enable_chunked_prefill: true
gpu_memory_utilization: 0.90

output_dir: artifacts/serving
