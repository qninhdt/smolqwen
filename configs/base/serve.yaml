# Serving semantics stay here. Measured operating-point settings live in
# configs/serving/{latency,balanced,throughput}.yaml.

# The benchmark target is the official public Qwen release, pinned so a moving Hub
# branch cannot silently change a measurement.
model_path: Qwen/Qwen3.5-2B
model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
served_model_name: smolqwen

max_model_len: 32768

# vLLM binds to loopback and the key-checking proxy is the only exposed service.
# --api-key challenges only GUARDED_PREFIX = ("/v1", "/v2", "/inference",
# "/cohere"), leaving /tokenize, /detokenize, /metrics, /version, /load open. On a
# public tunnel that is a free CPU-exhaustion vector plus model disclosure.
host: 127.0.0.1
port: 8000

reasoning_parser: qwen3
tool_call_parser: hermes

# MTP-1 only. Qwen3.5's GDN conv_states and recurrent_states carry no sequence
# dimension, so a partially accepted draft cannot be rolled back to the accepted
# prefix; a 1-token draft is all-or-nothing and needs no rollback. Left null until
# Phase 8 step 7 measures the acceptance rate.
speculative_num_tokens: null

enable_prefix_caching: true
enable_chunked_prefill: true

# Candidate values until the target-L4 sweep emits measured profiles. The nested
# model is closed so a hardware/training key cannot leak into serving profiles.
profile:
  dtype: bfloat16
  quantization: null
  kv_cache_dtype: auto
  kv_cache_scale: default
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  max_num_queued_reqs: null
  max_num_queued_tokens: null
  gpu_memory_utilization: 0.90
