# Prometheus scrape config for the single-L4 vLLM service.
#
# vLLM binds loopback :8000 inside the vllm-server network namespace and nginx
# (sharing that namespace) is the only authenticated door on :8080. Prometheus
# therefore scrapes /metrics *through* nginx and presents the same bearer key as
# every other client. The key is read from a mounted file so it never appears in
# this committed config, argv, or the Prometheus UI.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/vllm-api-key
    static_configs:
      - targets: ["vllm-server:8080"]
