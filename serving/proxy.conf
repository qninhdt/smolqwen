map $http_authorization $smolqwen_authorized {
    default 0;
    "Bearer ${VLLM_API_KEY}" 1;
}

server {
    listen 8080;
    server_name _;

    # This check is server-wide: every current and future path is denied before
    # it reaches vLLM unless the exact bearer key is present.
    if ($smolqwen_authorized = 0) {
        return 401;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
