name: smolqwen

services:
  vllm-server:
    build:
      context: .
      dockerfile: serving/Dockerfile
    image: smolqwen-vllm:0.26.0
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY must be set}
      SMOLQWEN_PROFILE: ${SMOLQWEN_PROFILE:-l4}
    volumes:
      - ${MODEL_PATH:-./artifacts/models/qwen3.5-2b-sft-grpo-merged}:/opt/smolqwen/artifacts/models/qwen3.5-2b-sft-grpo-merged:ro
      - ./artifacts/serving:/opt/smolqwen/artifacts/serving
    ports:
      # nginx shares this network namespace; vLLM's loopback-only :8000 is not published.
      - ${PROXY_PORT:-8080}:8080
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          -H "Authorization: Bearer $$VLLM_API_KEY"
          http://127.0.0.1:8000/v1/models >/dev/null
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  proxy:
    image: nginx:1.28.0-alpine
    network_mode: service:vllm-server
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY must be set}
    volumes:
      - ./serving/proxy.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      vllm-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header="Authorization: Bearer $$VLLM_API_KEY"
          http://127.0.0.1:8080/v1/models >/dev/null
      interval: 5s
      timeout: 3s
      retries: 12

  # Runs upstream's own benchmark against the proxied endpoint. The repo-local
  # wrapper this replaced only renamed vLLM's result fields into a dataclass; the
  # commands vLLM ships already own execution, resume, and the Pareto front.
  #
  # `--dataset-name custom` with a workload file is the point: `random` measures
  # token throughput on synthetic prompts, which says nothing about an agentic
  # request's prefill shape or its tool-schema overhead. Build the file first with
  # `smolqwen build-workload`.
  bench:
    image: smolqwen-vllm:0.26.0
    entrypoint: ["vllm"]
    command:
      - bench
      - serve
      - --base-url
      - http://vllm-server:8080
      - --model
      - smolqwen
      - --dataset-name
      - custom
      - --dataset-path
      - /opt/smolqwen/artifacts/serving/bfcl-agentic.jsonl
      - --skip-chat-template
      - --max-concurrency
      - "${SMOLQWEN_CONCURRENCY:-4}"
      - --percentile-metrics
      - ttft,tpot,itl,e2el
      - --metric-percentiles
      - 50,95,99
      - --save-result
      - --result-dir
      - /opt/smolqwen/artifacts/serving
    environment:
      # `vllm bench serve` reads the bearer key from the OpenAI variable.
      OPENAI_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY must be set}
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${MODEL_PATH:-./artifacts/models/qwen3.5-2b-sft-grpo-merged}:/opt/smolqwen/artifacts/models/qwen3.5-2b-sft-grpo-merged:ro
      - ./third_party:/opt/smolqwen/third_party:ro
      - ./artifacts/serving:/opt/smolqwen/artifacts/serving
    depends_on:
      proxy:
        condition: service_healthy
    profiles: [bench]

  # Minimal observability (opt-in): Prometheus scrapes vLLM's native /metrics
  # through the authenticated nginx door and Grafana reads only Prometheus.
  # `docker compose --profile observability up`. Nothing here consumes the GPU.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    volumes:
      - ./serving/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Same bearer key the proxy enforces, mounted from the generated (gitignored)
      # secret file so it never appears in this config, argv, or the Prometheus UI.
      - ./artifacts/serving/vllm-api-key:/etc/prometheus/secrets/vllm-api-key:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      # Loopback only; the metrics pipeline is never exposed on the host or a tunnel.
      - 127.0.0.1:9090:9090
    depends_on:
      vllm-server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      # No committed password: the admin secret must be supplied at bring-up.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./serving/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./serving/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only by default; put a real reverse proxy in front to expose it.
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus

volumes:
  grafana-data: {}
